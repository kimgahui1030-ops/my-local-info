# 카드뉴스 소재 수집 — 매일 05:30 KST 에 RSS·지역 데이터를 모아 cardnews/sources/<날짜>.json 으로 커밋한다.
# 예약 실행(schedule)은 기본 브랜치(main)에 이 파일이 있어야 동작한다.
name: cardnews-collect

on:
  schedule:
    - cron: "30 20 * * *" # 매일 20:30 UTC = 05:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardnews-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 인스타 벤치마킹(공식 API, 토큰 없으면 건너뜀)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python3 cardnews/collect/ig_benchmark.py

      - name: 소재 수집
        run: python3 cardnews/collect/collect_sources.py

      - name: 커밋
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add cardnews/sources
          if git diff --cached --quiet; then
            echo "새 소재 없음"
            exit 0
          fi
          # [CF-Pages-Skip]: 소재 커밋으로 웹사이트가 다시 배포되지 않게 한다
          git commit -m "chore(cardnews): 소재 수집 $(TZ=Asia/Seoul date +%F) [CF-Pages-Skip]"
          git push

      - name: 텔레그램 알림(떡상 즉시·월요일 주간 정리)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 cardnews/collect/notify.py
